<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurNightSky · Artemis II Tracker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#06030f; }

  #loader {
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#06030f;
    transition: opacity 0.6s ease;
  }
  #loader.fade-out { opacity:0; pointer-events:none; }

  .loader-moon { font-size:3rem; animation: spin 3s linear infinite; display:block; margin-bottom:20px; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .loader-text {
    font-family: monospace; font-size:0.75rem; letter-spacing:0.2em;
    color:rgba(196,181,253,0.5); text-transform:uppercase;
    animation: blink 1.2s ease infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #frame {
    width:100%; height:100%; border:none; display:block;
    opacity:0; transition:opacity 0.5s ease;
  }
  #frame.visible { opacity:1; }

  /* Theme switcher pill */
  #switcher {
    position:fixed; bottom:20px; right:20px; z-index:1000;
    display:flex; align-items:center; gap:8px;
  }
  .sw-btn {
    border:none; cursor:pointer;
    font-family:monospace; font-size:0.62rem; letter-spacing:0.12em;
    text-transform:uppercase; font-weight:700;
    padding:9px 16px; border-radius:20px;
    transition:all 0.2s;
  }
  .sw-btn.main {
    background:rgba(139,92,246,0.25);
    border:1px solid rgba(168,85,247,0.4);
    color:rgba(196,181,253,0.9);
  }
  .sw-btn.main:hover {
    background:rgba(139,92,246,0.45);
    color:#fff;
    box-shadow:0 0 16px rgba(139,92,246,0.4);
  }
  .sw-btn.theme-dot {
    width:10px; height:10px; border-radius:50%;
    padding:0; flex-shrink:0;
  }
  .sw-btn.theme-dot.t0 { background:#4ee8d0; border:2px solid rgba(78,232,208,0.5); }
  .sw-btn.theme-dot.t1 { background:#ffb830; border:2px solid rgba(255,184,48,0.5); }
  .sw-btn.theme-dot.t2 { background:#a855f7; border:2px solid rgba(168,85,247,0.5); }
  .sw-btn.theme-dot.active { transform:scale(1.4); box-shadow:0 0 10px currentColor; }

  #theme-label {
    font-family:monospace; font-size:0.55rem;
    letter-spacing:0.14em; text-transform:uppercase;
    color:rgba(196,181,253,0.4);
    position:fixed; bottom:52px; right:20px; z-index:1000;
  }
</style>
</head>
<body>

<div id="loader">
  <span class="loader-moon">🌙</span>
  <div class="loader-text">Loading mission data…</div>
</div>

<iframe id="frame" src="" title="OurNightSky Artemis II Tracker"></iframe>

<div id="theme-label"></div>
<div id="switcher">
  <button class="sw-btn theme-dot t0" onclick="setTheme(0)" title="Theme 1: Deep Space"></button>
  <button class="sw-btn theme-dot t1" onclick="setTheme(1)" title="Theme 2: Mission Control"></button>
  <button class="sw-btn theme-dot t2" onclick="setTheme(2)" title="Theme 3: Nebula"></button>
  <button class="sw-btn main" onclick="nextTheme()">↻ Switch Theme</button>
</div>

<script>
  const THEMES = [
    { file: 'ournightsky-artemis-tracker.html',    name: 'Deep Space',      color: '#4ee8d0' },
    { file: 'ournightsky-artemis-tracker-v2.html', name: 'Mission Control', color: '#ffb830' },
    { file: 'ournightsky-artemis-tracker-v3.html', name: 'Nebula Purple',   color: '#a855f7' },
  ];

  // Pick random theme, but don't repeat the same one twice in a row
  function pickRandom(exclude) {
    const options = [0, 1, 2].filter(i => i !== exclude);
    return options[Math.floor(Math.random() * options.length)];
  }

  function getInitialTheme() {
    // Check if there's a stored last theme — if so, pick a different random one
    const last = localStorage.getItem('ons_last_theme');
    const lastIdx = last !== null ? parseInt(last) : -1;
    return pickRandom(lastIdx);
  }

  let currentTheme = getInitialTheme();

  function setTheme(idx) {
    currentTheme = idx;
    applyTheme();
  }

  function nextTheme() {
    currentTheme = (currentTheme + 1) % THEMES.length;
    applyTheme();
  }

  function applyTheme() {
    const theme = THEMES[currentTheme];
    const frame = document.getElementById('frame');
    const loader = document.getElementById('loader');
    const label = document.getElementById('theme-label');

    // Show loader
    loader.classList.remove('fade-out');
    frame.classList.remove('visible');

    // Update dots
    document.querySelectorAll('.theme-dot').forEach((btn, i) => {
      btn.classList.toggle('active', i === currentTheme);
    });

    // Update label
    label.textContent = `Theme: ${theme.name}`;
    label.style.color = theme.color + '80';

    // Load frame
    frame.src = theme.file;
    frame.onload = () => {
      setTimeout(() => {
        loader.classList.add('fade-out');
        frame.classList.add('visible');
      }, 400);
    };

    // Save to localStorage
    localStorage.setItem('ons_last_theme', currentTheme);
  }

  // Init
  applyTheme();
</script>
</body>
</html>
